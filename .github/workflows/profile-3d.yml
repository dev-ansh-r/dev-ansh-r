name: Mission-Log-Graph

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-hail-mary-mission-log
    steps:
      - uses: actions/checkout@v4
      - name: Generate assets/mission.svg
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 gen_mission.py
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/mission.svg
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "generated: mission log"
          git push
