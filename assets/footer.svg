<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="176" viewBox="0 0 1000 176" role="img">
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace} .serif{font-family:Georgia, 'Times New Roman', serif}
.wind{animation:drift linear infinite}@keyframes drift{from{stroke-dashoffset:610}to{stroke-dashoffset:0}}
</style>

<rect width="1000" height="176" rx="18" fill="#0A0A0A"/>
<path d="M -50 40 C 250.0 22, 500.0 58, 1050 34" fill="none" stroke="#D97757" stroke-width="1.60" stroke-linecap="round" stroke-dasharray="90 520" opacity="0.30" class="wind" style="animation-duration:8s;animation-delay:-0s"/>
<path d="M -50 54 C 250.0 36, 500.0 72, 1050 48" fill="none" stroke="#D97757" stroke-width="1.35" stroke-linecap="round" stroke-dasharray="90 520" opacity="0.23" class="wind" style="animation-duration:10s;animation-delay:-3s"/>
<path d="M -50 68 C 250.0 50, 500.0 86, 1050 62" fill="none" stroke="#D97757" stroke-width="1.10" stroke-linecap="round" stroke-dasharray="90 520" opacity="0.16" class="wind" style="animation-duration:12s;animation-delay:-6s"/>
<path d="M -50 82 C 250.0 64, 500.0 100, 1050 76" fill="none" stroke="#D97757" stroke-width="0.85" stroke-linecap="round" stroke-dasharray="90 520" opacity="0.09" class="wind" style="animation-duration:14s;animation-delay:-9s"/>
<text x="500.0" y="80" text-anchor="middle" class="serif" font-size="40" font-style="italic" fill="#FAFAFA">Veni, vidi, vici.</text>
<text x="500.0" y="112" text-anchor="middle" class="mono" font-size="13" fill="#8A8A8A" letter-spacing="4">I CAME · I SAW · I CONQUERED</text>
<text x="500.0" y="146" text-anchor="middle" class="mono" font-size="15" fill="#D97757">- Elias</text>
</svg>
