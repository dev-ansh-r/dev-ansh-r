<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img">
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace} .serif{font-family:Georgia, 'Times New Roman', serif}
.mandala{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}.rev{animation-direction:reverse;animation-duration:40s}@keyframes spin{to{transform:rotate(360deg)}}
</style>

<rect width="1000" height="230" rx="18" fill="#F6F2E8"/>
<rect x="10" y="10" width="980" height="210" rx="12" fill="none" stroke="#E4DCC8" stroke-width="1"/>
<g class="mandala" fill="none" stroke="#2F5D50" stroke-width="1.4"><ellipse cx="500" cy="43" rx="5.5" ry="15" transform="rotate(0 500 58)"/><ellipse cx="500" cy="43" rx="5.5" ry="15" transform="rotate(30 500 58)"/><ellipse cx="500" cy="43" rx="5.5" ry="15" transform="rotate(60 500 58)"/><ellipse cx="500" cy="43" rx="5.5" ry="15" transform="rotate(90 500 58)"/><ellipse cx="500" cy="43" rx="5.5" ry="15" transform="rotate(120 500 58)"/><ellipse cx="500" cy="43" rx="5.5" ry="15" transform="rotate(150 500 58)"/><ellipse cx="500" cy="43" rx="5.5" ry="15" transform="rotate(180 500 58)"/><ellipse cx="500" cy="43" rx="5.5" ry="15" transform="rotate(210 500 58)"/><ellipse cx="500" cy="43" rx="5.5" ry="15" transform="rotate(240 500 58)"/><ellipse cx="500" cy="43" rx="5.5" ry="15" transform="rotate(270 500 58)"/><ellipse cx="500" cy="43" rx="5.5" ry="15" transform="rotate(300 500 58)"/><ellipse cx="500" cy="43" rx="5.5" ry="15" transform="rotate(330 500 58)"/></g>
<g class="mandala rev" fill="none" stroke="#7FA392" stroke-width="1.2"><ellipse cx="500" cy="50" rx="3" ry="8" transform="rotate(15 500 58)"/><ellipse cx="500" cy="50" rx="3" ry="8" transform="rotate(45 500 58)"/><ellipse cx="500" cy="50" rx="3" ry="8" transform="rotate(75 500 58)"/><ellipse cx="500" cy="50" rx="3" ry="8" transform="rotate(105 500 58)"/><ellipse cx="500" cy="50" rx="3" ry="8" transform="rotate(135 500 58)"/><ellipse cx="500" cy="50" rx="3" ry="8" transform="rotate(165 500 58)"/><ellipse cx="500" cy="50" rx="3" ry="8" transform="rotate(195 500 58)"/><ellipse cx="500" cy="50" rx="3" ry="8" transform="rotate(225 500 58)"/><ellipse cx="500" cy="50" rx="3" ry="8" transform="rotate(255 500 58)"/><ellipse cx="500" cy="50" rx="3" ry="8" transform="rotate(285 500 58)"/><ellipse cx="500" cy="50" rx="3" ry="8" transform="rotate(315 500 58)"/><ellipse cx="500" cy="50" rx="3" ry="8" transform="rotate(345 500 58)"/></g>
<circle cx="500" cy="58" r="3" fill="#2F5D50"/>
<text x="500" y="138" text-anchor="middle" class="sans" font-size="38" font-weight="700" fill="#2F5D50">lokāḥ samastāḥ sukhino bhavantu</text>
<text x="500" y="172" text-anchor="middle" class="serif" font-size="18" font-style="italic" fill="#5E8172">may all beings everywhere be happy and free</text>
<text x="500" y="205" text-anchor="middle" class="mono" font-size="11" fill="#9DB3A8" letter-spacing="4">WHY I BUILD</text>
</svg>
